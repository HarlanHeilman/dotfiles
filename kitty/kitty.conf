font_family      SF Mono
font_size        14.0
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD FiraCode Nerd Font
shell            /opt/homebrew/bin/fish --login
macos_option_as_alt yes
copy_on_select   clipboard
confirm_os_window_close 0
hide_window_decorations no
remember_window_size yes

# Translucent "glass": blur needs opacity < 1. Keep blur <= 64 (performance).
background_opacity 0.85
background_blur 40

# Colors come from the *-theme.auto.conf files, which follow macOS light/dark.
